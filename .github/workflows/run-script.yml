name: Script CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-installing-script:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner info
        run: |
          uname -a
          lsb_release -a || true
          echo "Shell: $SHELL"

      - name: Ensure script has LF endings
        run: |
          if file installing_script.sh | grep -q CRLF; then
            echo "Script has CRLF, converting to LF";
            sed -i 's/\r$//' installing_script.sh;
          fi

      - name: Make script executable
        run: chmod +x installing_script.sh

      - name: Run install script with sudo
        shell: bash
        run: sudo ./installing_script.sh

      - name: Validate inside fish (aliases + binaries)
        run: |
          echo "Entering fish to validate aliases and installed programs..."
          fish -c "
            echo 'Fish version:'; fish --version
            # Create sample files in HOME
            for n in 1 2 3
              echo 'TESTING FUNCTIONS' > $HOME/sample$n.txt
            end
            set funcs bat fd rg
            echo 'Testing alias functions:'
            for f in $funcs
              if functions -q $f
                echo 'Function ' $f ' exists; invoking --help first line:'
                $f --help | head -n 1 || true
              else
                echo 'Function ' $f ' MISSING'
              end
            end
            echo 'Sample files created:'; ls -1 $HOME/sample*.txt
            if functions -q bat
              echo 'Displaying sample files via bat:'
              for n in 1 2 3
                echo '--- sample'$n'.txt ---'
                bat $HOME/sample$n.txt || cat $HOME/sample$n.txt
              end
            end
          "
