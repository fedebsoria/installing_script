name: Script CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-installing-script:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner info
        run: |
          uname -a
          lsb_release -a || true
          echo "Shell: $SHELL"

      - name: Ensure script has LF endings
        run: |
          if file installing_script.sh | grep -q CRLF; then
            echo "Script has CRLF, converting to LF";
            sed -i 's/\r$//' installing_script.sh;
          fi

      - name: Make script executable
        run: chmod +x installing_script.sh

      - name: Run install script with sudo
        shell: bash
        run: sudo ./installing_script.sh

      - name: Validate inside fish (aliases + binaries)
        run: |
          echo "Entering fish to validate aliases and installed programs..."
          fish -c "
            echo 'Fish version:'; fish --version
            echo 'Autoload path:'; echo $fish_function_path
            set cmds fish jq batcat fd-find rg htop tmux git
            for c in $cmds
              if command -v $c >/dev/null
                echo 'Found ' $c ' -> ' (command -v $c)
              else
                echo 'Missing ' $c
              end
            end
            echo 'Listing saved function files (bat fd rg):'
            if test -d $HOME/.config/fish/functions
              ls -1 $HOME/.config/fish/functions | grep -E '^(bat|fd|rg)\.fish$' || true
            else
              echo 'No functions directory found'
            end
            echo 'Validating alias functions provided by install script...'
            for f in bat fd rg
              if functions -q $f
                echo 'Function ' $f ' already loaded'
              else if test -f $HOME/.config/fish/functions/$f.fish
                source $HOME/.config/fish/functions/$f.fish
                if functions -q $f
                  echo 'Function ' $f ' loaded after source'
                else
                  echo 'Function ' $f ' could not be loaded'
                end
              else
                echo 'Function file for ' $f ' missing'
              end
              if functions -q $f
                $f --help >/dev/null 2>/dev/null; or true
              end
            end
          "
